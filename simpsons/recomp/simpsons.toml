# The Simpsons Game - Xbox 360 (code identique NTSC-U et PAL it/es)
[main]
file_path = "../game/default.xex"
out_directory_path = "../ppc"
switch_table_file_path = "simpsons_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Trouvees par motif d'octets (une seule occurrence chacune)
restgprlr_14_address = 0x82A3C3E0
savegprlr_14_address = 0x82A3C390
restfpr_14_address = 0x82A3C5EC
savefpr_14_address = 0x82A3C5A0
restvmx_14_address = 0x82A445A8
savevmx_14_address = 0x82A44310
restvmx_64_address = 0x82A4463C
savevmx_64_address = 0x82A443A4

# longjmp appelle RtlUnwind ; setjmp suit juste apres (meme agencement de jmp_buf)
longjmp_address = 0x82A43D30
setjmp_address = 0x82A43E50

invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
    { data = 0x00485645, size = 0x43C }, # Fin de .text (donnees apres les thunks d'import)
]

